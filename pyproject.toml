[project]
name = "beleye"
version = "0.1.0"
description = "Desktop RTSP video surveillance app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "keyring>=24.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
theme = ["pyqtdarktheme>=2.1"]

[project.scripts]
beleye = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Translation workflow:
#   Extract new strings:
#     pylupdate6 main.py ui/ video/ -ts resources/translations/beleye_en.ts
#   Compile Russian translations:
#     lrelease resources/translations/beleye_ru.ts -qm resources/translations/beleye_ru.qm
